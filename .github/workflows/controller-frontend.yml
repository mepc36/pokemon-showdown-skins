name: Controller frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'skins/controller-client/**', '.github/workflows/controller-frontend.yml']
  pull_request:
    paths: ['frontend/**', 'skins/controller-client/**', '.github/workflows/controller-frontend.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: controller-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:userscript
      - uses: actions/upload-artifact@v4
        with:
          name: controller-userscript
          path: frontend/userscript-dist
      - uses: actions/upload-artifact@v4
        with:
          name: controller-static-build
          path: frontend/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        with:
          path: frontend/dist
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
