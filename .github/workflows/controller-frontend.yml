name: Controller frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/controller-frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/controller-frontend.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: controller-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser integration checks
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/controller-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          npm run test:browser
          TEST_BROWSER=webkit npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-browser-screenshots
          path: frontend/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: controller-static-build
          path: frontend/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        with:
          path: frontend/dist
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
