<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer"><meta name="theme-color" content="#b7cddd">
  <title>Showdown · Controller client</title>
  <link rel="stylesheet" href="./vendor/battle.css"><link rel="stylesheet" href="./vendor/sim-types.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button id="primary" class="primary" data-nav data-row="header" disabled>Connect to Showdown</button>
      <div id="battle-timer" aria-label="Battle timer"><span class="timer-icon" aria-hidden="true">⌛</span><span id="timer-value">Timer off</span><span id="timer-warning" role="status" aria-live="polite"></span></div>
    </header>
    <main>
      <div class="arena-card"><div class="arena-top" hidden><p id="notice" role="status" aria-live="polite"></p></div><div id="arena-wrap"><div id="arena" class="battle" aria-label="Battle animation"></div></div><div id="hidden-log" hidden></div></div>
      <section class="command-panel" aria-label="Battle choices"><div class="command-heading"><h2 id="prompt">Try the controls</h2><span id="turn-label">No live match</span><button id="tera" data-nav data-row="move-info" aria-pressed="false" hidden>Tera: Unknown</button><button id="undo" data-nav data-row="move-info" hidden>Cancel</button></div><div id="choices"></div></section>
      <div class="controller-bar"><div id="utility" hidden></div><button id="toggle-tools" data-nav data-row="tools" aria-expanded="false" aria-controls="utility">More controls</button></div>
    </main>
    <footer>Independent frontend · Official battle visuals · Chat hidden · Registered bots blocked in live searches</footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" data-nav data-row="modal-header" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <script src="./vendor/html-sanitizer-minified.js"></script><script src="./vendor/html-css-sanitizer-minified.js"></script><script src="./vendor/battle-log-misc.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
