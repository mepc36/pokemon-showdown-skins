<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer"><meta name="theme-color" content="#b7cddd">
  <title>Showdown · Controller client</title>
  <link rel="stylesheet" href="./vendor/battle.css"><link rel="stylesheet" href="./vendor/sim-types.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button id="primary" class="primary" data-nav data-row="header" disabled>Connect to Showdown</button>
      <div id="utility" role="group" aria-label="Battle controls"></div>
      <div id="battle-timer" aria-label="Battle timer"><svg class="timer-icon" aria-hidden="true" width="20" height="24" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2h14M3 22h14M5 2v4c0 3 5 4 5 6s-5 3-5 6v4M15 2v4c0 3-5 4-5 6s5 3 5 6v4M6 19h8M7 5h6"/></svg><span id="timer-value">Timer off</span><span id="timer-warning" role="status" aria-live="polite"></span></div>
    </header>
    <main>
      <div class="arena-card"><div class="arena-top" hidden><p id="notice" role="status" aria-live="polite"></p></div><div id="arena-wrap"><div id="arena" class="battle" aria-label="Battle animation"></div><aside id="matchup-own" class="matchup" aria-label="Your Pokémon attacking"></aside><aside id="matchup-foe" class="matchup" aria-label="Opponent attacking"></aside></div><div id="hidden-log" hidden></div></div>
      <section class="command-panel" aria-label="Battle choices"><div id="choices"></div><div id="action-slots" hidden><button id="tera" data-nav data-row="moves" aria-pressed="false" hidden>Tera: Unknown</button><button id="undo" data-nav data-row="moves" hidden>Cancel</button></div></section>
    </main>
    <footer>Independent frontend · Official battle visuals · Chat hidden · Registered bots blocked in live searches</footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" data-nav data-row="modal-header" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <script src="./vendor/html-sanitizer-minified.js"></script><script src="./vendor/html-css-sanitizer-minified.js"></script><script src="./vendor/battle-log-misc.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
