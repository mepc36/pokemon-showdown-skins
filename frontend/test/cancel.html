<!doctype html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer"><meta name="theme-color" content="#b7cddd">
  <title>Simulated server · battle controls test</title>
  <link rel="stylesheet" href="./vendor/battle.css"><link rel="stylesheet" href="./vendor/sim-types.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button id="primary" class="primary" data-nav data-row="header" disabled>Connect to Showdown</button>
      <div id="utility" role="group" aria-label="Battle controls"></div>
      <div id="battle-timer" aria-label="Battle timer"><svg class="timer-icon" aria-hidden="true" width="20" height="24" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2h14M3 22h14M5 2v4c0 3 5 4 5 6s-5 3-5 6v4M15 2v4c0 3-5 4-5 6s5 3 5 6v4M6 19h8M7 5h6"/></svg><span id="timer-value">Timer off</span><span id="timer-warning" role="status" aria-live="polite"></span></div>
    </header>
    <main>
      <div class="arena-card"><div class="arena-top" hidden><p id="notice" role="status" aria-live="polite"></p></div><div id="arena-wrap"><div id="arena" class="battle" aria-label="Battle animation"></div><aside id="matchup-own" class="matchup" aria-label="Your Pokémon attacking"></aside><aside id="matchup-foe" class="matchup" aria-label="Opponent attacking"></aside><aside id="chat-drawer" class="chat-drawer" aria-label="Battle chat" hidden><div id="hidden-log"></div></aside></div></div>
      <section class="command-panel" aria-label="Battle choices"><div id="choices"></div><div id="action-slots" hidden><button id="tera" data-nav data-row="moves" aria-pressed="false" hidden>Tera: Unknown</button><button id="undo" data-nav data-row="moves" hidden>Cancel</button></div></section>
    </main>
    <footer>Independent frontend · Official battle visuals · Chat hidden · Registered bots blocked in live searches</footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" data-nav data-row="modal-header" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <script src="./vendor/html-sanitizer-minified.js"></script><script src="./vendor/html-css-sanitizer-minified.js"></script><script src="./vendor/battle-log-misc.js"></script>
  <script type="module">
import {demoRequest, demoLines} from '/src/demo.mjs';
// This page is a local browser fixture only; Vite does not include it in dist.
// Fake the wire transport, leaving the production selection/undo/UI code intact.
const room = 'battle-gen9randombattle-12345';
const messages = document.createElement('pre');
messages.id = 'test-commands'; messages.setAttribute('aria-label', 'Simulated server commands');
document.body.append(messages);
window.WebSocket = class {
  readyState = 0;
  constructor() {
    window.testSocket = this;
    queueMicrotask(() => {
      this.readyState = 1; this.onopen?.();
      this.onmessage?.({data: '|updateuser|mepc36363636|1|1'});
      this.onmessage?.({data: `>${room}\n|init|battle\n${demoLines.join('\n')}\n|request|${JSON.stringify(demoRequest)}`});
    });
  }
  send(message) {
    messages.textContent += message + '\n';
    if (message.endsWith('|/timer on')) queueMicrotask(() => this.onmessage?.({data: `>${room}\n|inactive|Time left: 150 sec this turn | 150 sec total`}));
    if (message.endsWith('|/timer off')) queueMicrotask(() => this.onmessage?.({data: `>${room}\n|inactiveoff|Battle timer is OFF.`}));
  }
  close() { this.readyState = 3; }
};
await import('/src/main.js');
</script>
</body>
</html>
