<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Opponent information integration check</title>
<link rel="stylesheet" href="/vendor/battle.css">
<style>
  body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap}.test-stage{height:380px;overflow:hidden}
  #frame-wrap{position:relative;width:640px}#arena{position:absolute;transform-origin:top left;width:640px;height:360px}
  iframe{display:block;border:1px solid #aaa;margin:16px 0;max-width:none}
</style>
<h1>Opponent information integration check</h1>
<p>Offline fixtures only. No socket, sign-in or matchmaking.</p>
<button id="run">Run renderer checks</button><pre id="results">Ready</pre>
<div class="test-stage" id="app"><div class="app-header"></div><div class="arena-top"></div><div id="frame-wrap"><div id="arena" class="battle"></div></div><div class="command-panel"></div><div class="controller-bar"></div><footer></footer><div id="log" hidden></div></div>
<h2>Responsive layout fixtures</h2>
<iframe id="tablet" title="1024 by 650 layout" src="/" width="1024" height="650"></iframe>
<iframe id="phone" title="390 by 720 layout" src="/" width="390" height="720"></iframe>
<script src="/vendor/html-sanitizer-minified.js"></script>
<script src="/vendor/html-css-sanitizer-minified.js"></script>
<script src="/vendor/battle-log-misc.js"></script>
<script type="module">
import '/src/battle-data.ts';
import {demoLines, demoRequest} from '/src/demo.mjs';
const {Arena} = await import('/src/renderer.js');
let updates = 0;
const arena = new Arena(document.querySelector('#arena'), document.querySelector('#log'), () => updates++);
const room = 'battle-gen9randombattle-offlinecheck';
const flush = () => new Promise(resolve => queueMicrotask(resolve));
document.querySelector('#run').onclick = async () => {
  const results = document.querySelector('#results');
  results.textContent = '';
  const check = (condition, message) => {
    if (!condition) throw new Error(message);
    results.textContent += `PASS: ${message}\n`;
  };
  try {
    arena.receive({room, lines: demoLines, snapshot: true, request: demoRequest});
    await flush();
    check(arena.opponents().filter(p => p.revealed).length === 3, 'Snapshot has three known and three unknown slots');
    check(arena.opponents()[1].fainted, 'Fainted opponent remains inspectable');
    check(arena.speed('own', 1).value === 150 && arena.speed('own', 1).modified === 150, 'Own Speed uses request stats and the matching active renderer Pokémon');
    check(arena.speed('opponent', 1).value === '158 or 198', 'Landorus estimate uses the pinned Showdown calculation');
    check(arena.speed('opponent', 4).kind === 'unknown', 'Unknown opponents have no Speed estimate');
    check(arena.moveHint(1, 'icebeam').cue === 'green', 'Native effectiveness highlights a 4x Ice attack against Landorus');
    check(arena.moveHint(1, 'thunderbolt').cue === 'red', 'Native effectiveness marks Electric immunity');
    check(arena.moveHint(1, 'shadowball').cue === 'yellow', 'Neutral damage is yellow');
    check(arena.moveHint(1, 'toxic').cue === 'yellow', 'Toxic has no damage-effectiveness color when status can apply');
    check(!arena.moveHint(1, 'protect').cue && !arena.moveHint(1, 'nastyplot').cue, 'Protect and self boosts have no matchup border');
    check(arena.moveHint(2, 'icebeam').cue === 'green', 'Benched Pokémon get the same move-effectiveness calculation');
    check(arena.speedHint(1).cue === 'red', 'Known slower own Speed is red against the revealed opponent range');
    const storedParty = arena.battle.mySide.pokemon;
    arena.battle.mySide.pokemon = storedParty.filter(p => p.ident !== demoRequest.side.pokemon[1].ident);
    check(arena.moveHint(2, 'icebeam').cue === 'green', 'A never-seen bench Pokémon uses private data without creating a renderer sprite');
    arena.battle.mySide.pokemon = storedParty;
    const before = updates;
    arena.receive({room, lines: ['|switch|p2a: Dragonite|Dragonite, L80, M|70/100', '|move|p2a: Dragonite|Extreme Speed|p1a: Grumpig', '|-terastallize|p2a: Dragonite|Normal', '|turn|17']});
    arena.skip();
    await flush();
    const revealed = arena.opponents()[3];
    check(updates > before && revealed.name === 'Dragonite', 'Incremental reveal notifies the UI');
    check(revealed.active && revealed.teraType === 'Normal' && revealed.moves[0].id === 'extremespeed', 'Move and Tera reveals update from battle events');
    arena.receive({room, lines: demoLines, snapshot: true, request: demoRequest});
    await flush();
    check(!arena.opponents()[3].revealed, 'Snapshot rebuild drops stale later information');
    const raikouLines = [...demoLines, '|switch|p2a: Raikou|Raikou, L82|100/100', '|turn|17'];
    arena.receive({room, lines: raikouLines, snapshot: true, request: demoRequest});
    await flush();
    check(arena.speed('opponent', 4).value === '193 or 236', 'Level 82 Raikou matches the screenshot: 193 or 236');
    const modifiedRequest = structuredClone(demoRequest);
    modifiedRequest.side.pokemon[0].item = 'choicescarf';
    modifiedRequest.side.pokemon[0].condition = '297/297 par';
    arena.receive({room, lines: [...demoLines, '|-boost|p1a: Grumpig|spe|1', '|-status|p1a: Grumpig|par', '|turn|17'], snapshot: true, request: modifiedRequest});
    await flush();
    check(arena.speed('own', 1).value === 150 && arena.speed('own', 1).modified === 168, 'Native Speed modifiers combine boost, Choice Scarf and paralysis with correct rounding');
    arena.receive({room, lines: [...demoLines, '|-sidestart|p1: mepc36363636|move: Tailwind', '|turn|17'], snapshot: true, request: demoRequest});
    await flush();
    check(arena.speed('own', 1).modified === 300, 'Native Speed calculation includes Tailwind');
    check(arena.speedHint(1).cue === 'green', 'Speed borders include our Tailwind');
    arena.receive({room, lines: [...demoLines, '|-sidestart|p2: Offline preview|move: Tailwind', '|turn|17'], snapshot: true, request: demoRequest});
    check(arena.speedHint(1).cue === 'red' && arena.speedHint(1).label.includes('316–396'), 'Opponent Tailwind uses the opponent side, not ours');
    arena.receive({room, lines: [...demoLines, '|switch|p2a: Skarmory|Skarmory, L80, M|100/100', '|turn|17'], snapshot: true, request: demoRequest});
    check(arena.moveHint(1, 'toxic').cue === 'red', 'Toxic is red against a Steel opponent');
    arena.receive({room, lines: [...demoLines, '|switch|p2a: Amoonguss|Amoonguss, L80, M|100/100', '|turn|17'], snapshot: true, request: demoRequest});
    check(arena.moveHint(1, 'spore').cue === 'red', 'Powder immunity is preserved for Grass targets');
    arena.receive({room, lines: raikouLines, snapshot: true, request: demoRequest});
    check(arena.moveHint(1, 'glare').cue === 'red', 'Status-only paralysis immunity is preserved for Electric targets');
    arena.receive({room, lines: [...demoLines, '|switch|p2a: Rotom|Rotom-Wash, L80|100/100', '|-ability|p2a: Rotom|Levitate', '|turn|17'], snapshot: true, request: demoRequest});
    check(arena.moveHint(2, 'earthquake').cue === 'red', 'Revealed Levitate is respected for benched move inspection');
    arena.battle.seekTurn(0);
    check(arena.speed('own', 1).modified === undefined, 'Replay does not combine the latest private request with earlier field effects');
    check(!arena.moveHint(1, 'icebeam').cue && !arena.speedHint(1).cue, 'Replay does not show stale matchup borders');
    arena.receive({room, lines: demoLines, snapshot: true, request: {side: {id: 'p2', pokemon: [{ident: 'p2: Landorus', details: 'Landorus, L76, M', condition: '31/100', active: true}]}}});
    await flush();
    check(arena.opponents().some(p => p.name === 'Grumpig') && !arena.opponents().some(p => p.name === 'Landorus'), 'Player two sees player one as the opponent');
    check(arena.speed('opponent', arena.opponents().findIndex(p => p.name === 'Grumpig') + 1).value === '152 or 200', 'Player two gets opponent Speed from the correct side');
    check(arena.speed('own', 1).kind === 'unknown', 'Missing private stats are not inferred from species');
    arena.receive({room: 'battle-gen9randombattle-nextcheck', lines: ['|gen|9', '|teamsize|p1|6', '|teamsize|p2|6'], snapshot: true});
    await flush();
    check(arena.opponents().every(p => !p.revealed), 'New room clears previous opponents');
    check(arena.speed('opponent', 1).kind === 'unknown' && arena.speed('own', 1).kind === 'unknown', 'New room clears previous Speed data');
    results.textContent += 'All checks passed.';
  } catch (error) { results.textContent += `FAIL: ${error.message}`; }
};
</script>
</html>
